<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Picker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Loading / error splash */
  #splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 12px;
    color: #555;
    font-size: 0.95rem;
  }
  #splash.error { color: #f87171; }

  /* Main picker UI */
  #picker { display: none; flex-direction: column; height: 100vh; }

  #header {
    padding: 16px 24px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-shrink: 0;
  }

  #location-name { font-size: 1.2rem; font-weight: 600; color: #fff; }
  #progress { color: #555; font-size: 0.85rem; margin-left: auto; }

  #save-status {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 4px;
    transition: opacity 0.4s;
    opacity: 0;
  }
  #save-status.saving  { background: #1e3a5f; color: #7dd3fc; opacity: 1; }
  #save-status.saved   { background: #14532d; color: #86efac; opacity: 1; }
  #save-status.error   { background: #450a0a; color: #fca5a5; opacity: 1; }

  #description {
    padding: 12px 24px;
    color: #888;
    font-size: 0.85rem;
    line-height: 1.5;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
    max-height: 80px;
    overflow: hidden;
  }

  #gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 24px;
    flex: 1;
    overflow-y: auto;
    align-content: flex-start;
  }

  .thumb-wrap {
    position: relative;
    width: calc(20% - 8px);
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.1s;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb-wrap:hover { border-color: #4a9eff; transform: scale(1.02); }
  .thumb-wrap.selected { border-color: #22c55e; }
  .thumb-wrap.dismissed { opacity: 0.15; pointer-events: none; }

  .thumb-dismiss {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: #f87171;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    backdrop-filter: blur(4px);
    z-index: 10;
    border: 1px solid rgba(248,113,113,0.4);
    line-height: 1;
  }
  .thumb-dismiss:hover { background: rgba(220,38,38,0.8); color: #fff; }
  .thumb-wrap:hover .thumb-dismiss { opacity: 1; }

  .thumb-wrap img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .thumb-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .thumb-wrap.loading img { opacity: 0; }
  .thumb-wrap .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 0.8rem;
  }

  #footer {
    padding: 12px 24px;
    border-top: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  #hint { color: #444; font-size: 0.8rem; }

  #skip-btn {
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid #333;
    cursor: pointer;
    font-size: 0.85rem;
    background: #222;
    color: #888;
    margin-left: auto;
  }
  #skip-btn:hover { background: #2a2a2a; }

  #done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 16px;
    color: #aaa;
  }
  #done-screen h2 { color: #22c55e; font-size: 1.5rem; }
</style>
</head>
<body>

<div id="splash">Loading…</div>

<div id="picker">
  <div id="header">
    <div id="location-name"></div>
    <div id="save-status"></div>
    <div id="progress"></div>
  </div>
  <div id="description"></div>
  <div id="gallery"></div>
  <div id="footer">
    <span id="hint">Press <kbd>1</kbd>–<kbd>9</kbd> or <kbd>0</kbd> (10th) to pick · <kbd>→</kbd> or <kbd>S</kbd> to skip</span>
    <button id="skip-btn">Skip →</button>
  </div>
</div>

<div id="done-screen">
  <h2>All done!</h2>
  <p>No more locations to review.</p>
  <button id="reload-btn" style="margin-top:8px;padding:10px 24px;border-radius:8px;background:#1e3a5f;color:#7dd3fc;border:1px solid #2563eb;cursor:pointer;font-size:0.9rem;">Check for more →</button>
</div>

<script>
// Port is configurable via ?port= query param (default 8766)
// e.g. http://localhost:8766  or  http://localhost:8767
const _port = new URLSearchParams(window.location.search).get('port') || '8766';
const API = `http://localhost:${_port}/api/data`;

let data = [];
let queue = [];
let currentQueueIdx = 0;

// ── Boot ──────────────────────────────────────────────────────────────────────

async function boot() {
  const splash = document.getElementById('splash');
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    data = Array.isArray(json) ? json : [json];
    // Auto-assign single images, queue only those with multiple choices
    let autoAssigned = 0;
    data.forEach(item => {
      if (!item.Image && Array.isArray(item.Images) && item.Images.length === 1) {
        item.Image = item.Images[0];
        autoAssigned++;
      }
    });
    queue = data
      .map((_, i) => i)
      .filter(i => Array.isArray(data[i].Images) && data[i].Images.length > 1 && !data[i].Image);
    splash.style.display = 'none';
    document.getElementById('picker').style.display = 'flex';
    if (autoAssigned > 0) saveData();
    showCurrent();
  } catch (e) {
    splash.className = 'error';
    splash.textContent = `Failed to load data: ${e.message}`;
  }
}

boot();

// ── Save ──────────────────────────────────────────────────────────────────────

let saveTimer = null;

async function saveData() {
  const status = document.getElementById('save-status');
  status.textContent = 'Saving…';
  status.className = 'saving';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data, null, 2)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    status.textContent = 'Saved ✓';
    status.className = 'saved';
  } catch (e) {
    status.textContent = `Save failed: ${e.message}`;
    status.className = 'error';
  }
  // Fade out after 2s
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { status.style.opacity = '0'; }, 2000);
}

// ── Picker ────────────────────────────────────────────────────────────────────

function showCurrent() {
  if (currentQueueIdx >= queue.length) {
    document.getElementById('picker').style.display = 'none';
    document.getElementById('done-screen').style.display = 'flex';
    return;
  }

  const item = data[queue[currentQueueIdx]];
  document.getElementById('location-name').textContent = item.Name;
  document.getElementById('description').textContent = item.DescriptionModified || item.Description || '';
  document.getElementById('progress').textContent = `${currentQueueIdx + 1} / ${queue.length}`;

  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  item.Images.forEach((url, idx) => {
    const n = idx === 9 ? '0' : String(idx + 1);
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap loading';

    const badge = document.createElement('div');
    badge.className = 'thumb-badge';
    badge.textContent = n;

    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.textContent = 'loading…';

    const img = document.createElement('img');
    img.src = url;
    img.alt = `Image ${n}`;
    img.addEventListener('load',  () => wrap.classList.remove('loading'));
    img.addEventListener('error', () => { spinner.textContent = 'failed'; });

    const dismiss = document.createElement('div');
    dismiss.className = 'thumb-dismiss';
    dismiss.textContent = '✕';
    dismiss.title = 'Remove this image';
    dismiss.addEventListener('click', e => {
      e.stopPropagation();
      dismissImage(idx);
    });

    wrap.appendChild(img);
    wrap.appendChild(badge);
    wrap.appendChild(spinner);
    wrap.appendChild(dismiss);
    wrap.addEventListener('click', () => pick(idx));
    gallery.appendChild(wrap);
  });
}

function pick(imageIdx) {
  const item = data[queue[currentQueueIdx]];
  item.Image = item.Images[imageIdx];

  const thumbs = document.querySelectorAll('.thumb-wrap');
  if (thumbs[imageIdx]) thumbs[imageIdx].classList.add('selected');

  saveData();

  setTimeout(() => {
    currentQueueIdx++;
    showCurrent();
  }, 250);
}

function dismissImage(imageIdx) {
  const item = data[queue[currentQueueIdx]];
  item.Images.splice(imageIdx, 1);

  if (item.Images.length === 0) {
    // No images left — skip this location
    skip();
  } else if (item.Images.length === 1) {
    // Only one left — auto-pick it
    item.Image = item.Images[0];
    saveData();
    const thumbs = document.querySelectorAll('.thumb-wrap');
    const remaining = [...thumbs].find(t => !t.classList.contains('dismissed'));
    if (remaining) remaining.classList.add('selected');
    setTimeout(() => { currentQueueIdx++; showCurrent(); }, 300);
  } else {
    // Re-render with updated list
    showCurrent();
  }
}

function skip() {
  currentQueueIdx++;
  showCurrent();
}

document.getElementById('skip-btn').addEventListener('click', skip);

document.getElementById('reload-btn').addEventListener('click', async () => {
  const btn = document.getElementById('reload-btn');
  btn.textContent = 'Checking…';
  btn.disabled = true;
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    data = Array.isArray(json) ? json : [json];

    // Auto-assign any new single-image entries
    let autoAssigned = 0;
    data.forEach(item => {
      if (!item.Image && Array.isArray(item.Images) && item.Images.length === 1) {
        item.Image = item.Images[0];
        autoAssigned++;
      }
    });
    queue = data
      .map((_, i) => i)
      .filter(i => Array.isArray(data[i].Images) && data[i].Images.length > 1 && !data[i].Image);
    currentQueueIdx = 0;

    if (autoAssigned > 0) await saveData();

    if (queue.length === 0) {
      btn.textContent = 'Nothing new — all done!';
      return;
    }
    document.getElementById('done-screen').style.display = 'none';
    document.getElementById('picker').style.display = 'flex';
    showCurrent();
  } catch (e) {
    btn.textContent = `Error: ${e.message}`;
  }
});

document.addEventListener('keydown', e => {
  if (document.getElementById('picker').style.display === 'none') return;

  let n = parseInt(e.key);
  if (e.key === '0') n = 10;
  if (n >= 1 && n <= 10) {
    const item = data[queue[currentQueueIdx]];
    if (item && n <= item.Images.length) pick(n - 1);
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 's' || e.key === 'S') {
    skip();
  }
});
</script>
</body>
</html>
